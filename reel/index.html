<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kestrel Demo Reel</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #0A0A0A; color: #C9C5BD; font-family: system-ui, sans-serif; min-height: 100svh; display: grid; place-items: center; }
main { width: min(100%, 440px); padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
video { width: 100%; aspect-ratio: 9 / 16; border-radius: 16px; background: #000; display: block; }
.btns { display: grid; gap: 12px; margin-top: 16px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 20px; border-radius: 14px;
  font-size: 18px; font-weight: 700; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s, filter .12s; }
.btn:active { transform: scale(.98); filter: brightness(.92); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn svg { width: 22px; height: 22px; flex: none; }
.primary { background: #D4AF37; color: #0A0A0A; box-shadow: 0 6px 20px rgba(212, 175, 55, .28); }
.secondary { background: transparent; color: #F2EEE6; border: 2px solid rgba(242, 238, 230, .55); }
p { font-size: 14px; line-height: 1.5; margin: 14px 2px 0; text-align: center; }
</style>
</head>
<body>
<main>
<video src="kestrel-demo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
<div class="btns">
  <a class="btn primary" href="../site/">Open the demo site
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <a class="btn secondary" href="kestrel-demo.mp4" download>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download the video</a>
</div>
<p>Kestrel Build Co. demo reel v2.1, 34 s. Tap play with sound on.</p>
</main>
</body>
</html>
